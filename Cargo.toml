[package]
name = "kstrata"
version = "0.1.0"
edition = "2021"
description = "Exact-match k-mer strata: for every base of a query genome, which subject genomes carry its k-mer, and how many times the query carries it, across scales of k"
license = "MIT"
authors = ["Claude Fable 5.1 (Anthropic)", "J. Lane <jlanej@gmail.com>"]
repository = "https://github.com/jlanej/kstrata"
homepage = "https://jlanej.github.io/kstrata/"
readme = "README.md"
keywords = ["genomics", "kmer", "alignment-free", "comparative-genomics", "T2T"]
categories = ["science", "command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
libc = "0.2"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
